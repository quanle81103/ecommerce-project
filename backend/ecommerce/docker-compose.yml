services:

  postgres:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build: .
    restart: unless-stopped

    environment:
      AWS_REGION: ap-southeast-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ecommerce
      PGUSER: postgres
      PGPASSWORD: postgres
      REDISHOST: redis
      REDISPORT: 6379
      JWT_EXPIRATIONTIME: 604800000
      JWT_SECRETKEY: ${JWT_SECRETKEY}
      GHN_TOKEN: ${GHN_TOKEN}
      GHN_BASE_URL: ${GHN_BASE_URL}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}

      PAYMENT_VNPAY_TMNCODE: ${PAYMENT_VNPAY_TMNCODE}
      PAYMENT_VNPAY_VERSION: ${PAYMENT_VNPAY_VERSION}
      PAYMENT_VNPAY_PAYURL: ${PAYMENT_VNPAY_PAYURL}
      PAYMENT_VNPAY_RETURNURL: ${PAYMENT_VNPAY_RETURNURL}
      PAYMENT_VNPAY_COMMAND: ${PAYMENT_VNPAY_COMMAND}
      PAYMENT_VNPAY_ORDERTYPE: ${PAYMENT_VNPAY_ORDERTYPE}
      PAYMENT_VNPAY_HASHSECRET: ${PAYMENT_VNPAY_HASHSECRET}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}

      GHN_CACHE_SHOP_TTL: 10
      GHN_CACHE_WARD_TTL: 1440
      GHN_CACHE_DISTRICT_TTL: 1440
      GHN_CACHE_PROVINCE_TTL: 1440
      GHN_CACHE_DEFAULT: 10

      API_PREFIX: /api/v1

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  postgres_data:
