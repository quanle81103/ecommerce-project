spring.application.name=ecommerce

# Database
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format-sql=true
spring.datasource.hikari.auto-commit=false

api.prefix=/api/v1

# AWS
aws.region=
aws.s3.bucket=

# JWT
jwt.expirationtime=604800000
jwt.secretkey=

# VNPay
payment.vnPay.tmnCode=
payment.vnPay.hashSecret=
payment.vnPay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
payment.vnPay.returnUrl=http://localhost:8080/api/v1/payment/vnpay-callback
payment.vnPay.command=pay
payment.vnPay.version=2.1.0
payment.vnPay.orderType=other

# Logging
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

# GHN
ghn.token=
ghn.base-url=https://online-gateway.ghn.vn
ghn.cache.default=10
ghn.cache.shop-ttl=10
ghn.cache.ward-ttl=1440
ghn.cache.district-ttl=1440
ghn.cache.province-ttl=1440