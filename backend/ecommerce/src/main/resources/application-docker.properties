spring.application.name=ecommerce
server.address=0.0.0.0
server.port=${PORT:8080}

api.prefix=${API_PREFIX:/api/v1}

# PostgreSQL: defaults support local Docker Compose; cloud values come from environment variables.
spring.datasource.url=jdbc:postgresql://${PGHOST:postgres}:${PGPORT:5432}/${PGDATABASE:ecommerce}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.hikari.auto-commit=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Redis
spring.data.redis.host=${REDISHOST:redis}
spring.data.redis.port=${REDISPORT:6379}
spring.data.redis.username=${REDISUSER:}
spring.data.redis.password=${REDISPASSWORD:}
spring.cache.type=redis

# Browser clients
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# AWS S3
aws.region=${AWS_REGION:ap-southeast-1}
aws.s3.bucket=${AWS_S3_BUCKET}
aws.accesskey=${AWS_ACCESS_KEY_ID}
aws.secretkey=${AWS_SECRET_ACCESS_KEY}

# JWT
jwt.expirationtime=${JWT_EXPIRATIONTIME:604800000}
jwt.secretkey=${JWT_SECRETKEY}

# VNPay sandbox
payment.vnPay.tmnCode=${PAYMENT_VNPAY_TMNCODE}
payment.vnPay.hashSecret=${PAYMENT_VNPAY_HASHSECRET}
payment.vnPay.payUrl=${PAYMENT_VNPAY_PAYURL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
payment.vnPay.returnUrl=${PAYMENT_VNPAY_RETURNURL}
payment.vnPay.command=${PAYMENT_VNPAY_COMMAND:pay}
payment.vnPay.version=${PAYMENT_VNPAY_VERSION:2.1.0}
payment.vnPay.orderType=${PAYMENT_VNPAY_ORDERTYPE:other}

# Mail
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# GHN
ghn.token=${GHN_TOKEN}
ghn.base_url=${GHN_BASE_URL:https://online-gateway.ghn.vn}
ghn.cache.default=${GHN_CACHE_DEFAULT:10}
ghn.cache.shop-ttl=${GHN_CACHE_SHOP_TTL:10}
ghn.cache.ward-ttl=${GHN_CACHE_WARD_TTL:1440}
ghn.cache.district-ttl=${GHN_CACHE_DISTRICT_TTL:1440}
ghn.cache.province-ttl=${GHN_CACHE_PROVINCE_TTL:1440}
